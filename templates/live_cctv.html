<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live CCTV - Cyber Watch</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo-area">
            <h1>CYBER<span class="logo-accent">WATCH</span></h1>
        </div>
        
        <div class="sidebar-clock">
            <div id="live-clock"></div>
        </div>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/live-cctv" class="active">Live CCTV</a>
            <a href="/threat-logs">Threat Logs</a>
            <a href="/analytics">Analytics</a>
        </nav>
        <div class="sidebar-footer">
            <a href="/logout">Logout</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <h2 class="page-title">Live CCTV Monitoring</h2>
                <p class="text-muted">Real-time AI surveillance and security monitoring system</p>
            </div>
            <div class="topbar-right">
                <div class="profile-box">
                    <span class="status-dot green"></span>
                    <span>{{ user | default('admin') }}</span>
                </div>
            </div>
        </header>

        <div class="cctv-grid">
            <div class="cctv-card camera-section">
                <div class="section-header">
                    <div class="header-left">
                        <h3>CAMERA 01</h3>
                    </div>
                    <div class="live-indicator"><span class="dot red"></span> Live</div>
                </div>
                <video id="localVideo" autoplay muted playsinline class="camera-feed" style="border-radius: 8px; width: 100%; height: auto; border: 1px solid var(--border-color);"></video>
                <p id="cam-status" style="color:var(--text-muted); margin-top:10px; font-size:13px;"></p>
            </div>

            <div class="camera-side-panel">
                <div class="camera-info-card">
                    <h3>Camera Status</h3>
                    <p id="status-text" class="green-text">CONNECTING</p>
                </div>
                <div class="camera-info-card">
                    <h3>AI Detection</h3>
                    <p class="green-text">ACTIVE</p>
                </div>
                <div class="camera-info-card">
                    <h3>Resolution</h3>
                    <p>1280x720</p>
                </div>
                <div class="camera-info-card">
                    <h3>Frame Rate</h3>
                    <p>30 FPS</p>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
<script>
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 1280, height: 720 },
            audio: false
        });
        document.getElementById("localVideo").srcObject = stream;
        document.getElementById("status-text").textContent = "ONLINE";
        document.getElementById("cam-status").textContent = "";
    } catch (err) {
        document.getElementById("cam-status").textContent = "Camera access denied or unavailable.";
        document.getElementById("status-text").textContent = "OFFLINE";
        document.getElementById("status-text").className = "red-text";
    }
}
startCamera();
</script>
</body>
</html>
